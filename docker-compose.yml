# Local run. On Huawei Cloud, replace the db service with RDS for PostgreSQL
# and set DATABASE_URL to the RDS connection string.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex_local_only
      POSTGRES_DB: cortex
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://cortex:cortex_local_only@db:5432/cortex
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  pgdata:
