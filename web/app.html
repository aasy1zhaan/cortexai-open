<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CortexAI Clinic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<style>
  /* layout: fixed left rail + scrolling work area; dense, scannable panels; severity encoded by stripe and chip */
  html, body { height: 100%; }
  body { display: grid; grid-template-columns: 232px 1fr; background: var(--ink); }
  .rail { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 18px 14px; border-right: 1px solid var(--line);
    background: linear-gradient(180deg, #061633, #030c1a 70%); }
  .rail .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; text-decoration: none; }
  .rail .brand img { height: 22px; }
  .rail .brand span { font-family: var(--display); font-size: 12px; letter-spacing: .06em; }
  .rail .grp { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; padding: 14px 10px 6px; }
  .rail a[data-v] { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; text-decoration: none; color: #c9d7ec; font-size: 14px; font-weight: 500; }
  .rail a[data-v] svg { width: 16px; height: 16px; opacity: .8; }
  .rail a[data-v]:hover { background: rgba(255,255,255,.05); }
  .rail a[data-v].on { background: rgba(13,143,253,.16); color: #fff; box-shadow: inset 2px 0 0 var(--blue); }
  .rail .me { margin-top: auto; padding: 12px 10px; border-top: 1px solid var(--line); display: grid; gap: 2px; font-size: 13px; }
  .rail .me b { font-weight: 600; } .rail .me .sub { font-size: 12px; }
  .rail .me button { margin-top: 8px; justify-self: start; padding: 6px 10px; font-size: 13px; }

  #main { min-width: 0; padding: 0 28px 48px; }
  .top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; padding: 16px 0 14px; background: linear-gradient(var(--ink) 75%, transparent); }
  .top .tt { min-width: 0; flex: 1; }
  .top h1 { font-family: var(--display); font-size: 18px; font-weight: 400; letter-spacing: .02em; }
  #crumb { font-size: 13px; color: var(--muted); } #crumb a { color: var(--muted); }
  #gsearch { width: 240px; background: var(--navy); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; outline: none; }
  #gsearch:focus { border-color: var(--blue); }
  #mode { font-size: 12px; padding: 6px 10px; border-radius: 999px; border: 1px solid rgba(63,214,155,.4); color: #9fe9c8; background: rgba(63,214,155,.08); white-space: nowrap; }
  #mode.demo { border-color: rgba(255,138,31,.45); color: #ffc58f; background: rgba(255,138,31,.08); }

  .panel { background: linear-gradient(180deg, rgba(10,32,64,.62), rgba(7,24,50,.62)); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
  .ph { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .ph h3 { font-size: 15px; font-weight: 700; }
  .sub { color: var(--muted); font-size: 12.5px; }
  .grid { display: grid; gap: 16px; margin-top: 16px; }
  .g-2-1 { grid-template-columns: 1.7fr 1fr; } .g-1-1 { grid-template-columns: 1fr 1fr; }
  section.panel + section.panel, .grid + section.panel, section.panel + .grid { margin-top: 16px; }
  .grid > .panel { margin-top: 0 !important; }
  .g-2-1 { align-items: start; }
  .loading, .empty { color: var(--muted); padding: 28px; text-align: center; }
  .note { padding: 10px 12px; border-radius: 10px; background: rgba(255,138,31,.08); border: 1px solid rgba(255,138,31,.3); color: #ffd3a8; font-size: 13px; margin: 0 0 14px; }
  .errbox p { color: var(--muted); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* worklist */
  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .tile { text-align: left; display: grid; gap: 2px; padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line); background: rgba(10,32,64,.5); cursor: pointer; position: relative; overflow: hidden; }
  .tile::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--c); }
  .tile.on { border-color: var(--c); background: rgba(13,143,253,.08); }
  .tile .tk { font-size: 12.5px; color: #c9d7ec; font-weight: 600; } .tile .tv { font-size: 28px; font-weight: 500; color: #fff; } .tile .ts { font-size: 12px; color: var(--muted); }
  .wl { margin-top: 16px; padding: 0; }
  .wl-tools { display: flex; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .fchip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; color: #c9d7ec; }
  .fchip.on { background: var(--text); color: var(--ink); border-color: var(--text); font-weight: 600; }
  .search input { background: var(--ink); border: 1px solid var(--line); border-radius: 9px; padding: 7px 11px; width: 220px; outline: none; }
  .tbl-wrap { overflow-x: auto; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .tbl th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .tbl td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tbl tbody tr[data-id] { cursor: pointer; } .tbl tbody tr[data-id]:hover, .tbl tbody tr[data-id]:focus { background: rgba(13,143,253,.07); outline: none; }
  .tbl .r { text-align: right; } .tbl td.hot { color: #ffb0aa; font-weight: 600; }
  .tbl.compact td { padding: 8px 12px; }
  .sev-h { width: 6px; padding-right: 0 !important; } .sev { display: block; width: 4px; height: 34px; border-radius: 3px; }
  .riskcell { display: flex; align-items: center; gap: 8px; } .rv { font-size: 16px; font-weight: 500; min-width: 42px; }
  .delta { font-size: 11px; font-family: var(--mono); white-space: nowrap; } .delta.up { color: #ff9d94; } .delta.down { color: #9fe9c8; }
  .chip { display: inline-block; font-size: 11.5px; padding: 3px 8px; border-radius: 999px; margin: 2px 4px 2px 0; border: 1px solid; white-space: nowrap; }
  .chip.hi { color: #ffb0aa; border-color: rgba(255,93,82,.5); background: rgba(255,93,82,.12); }
  .chip.md { color: #ffd59a; border-color: rgba(255,181,71,.45); background: rgba(255,181,71,.1); }
  .more { font-size: 12px; color: var(--muted); } .sig { max-width: 340px; }
  .rv-ok { color: #9fe9c8; font-size: 13px; }

  /* patient */
  .pt-head { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
  .pt-name { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .pt-name h2 { font-size: 24px; font-weight: 700; }
  .facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 18px; margin: 16px 0 0; }
  .facts dt { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; } .facts dd { margin: 2px 0 0; font-size: 14px; }
  .pt-risk { border-left: 1px solid var(--line); padding-left: 20px; display: grid; gap: 6px; align-content: start; }
  .pt-risk .big { font-size: 52px; line-height: 1; color: var(--c); font-weight: 500; }
  .rk-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .band { color: #04101f; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
  .pt-risk .acts { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .labs-strip { display: grid; grid-template-columns: auto repeat(9, minmax(0, 1fr)); gap: 12px; align-items: center; margin-top: 16px; padding: 12px 18px; }
  .labs-strip div { display: grid; } .labs-strip span { font-size: 11.5px; color: var(--muted); } .labs-strip b { font-size: 15px; font-weight: 500; }
  .alerts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .alerts li { display: grid; gap: 2px; padding: 10px 12px; border-radius: 10px; border-left: 3px solid; background: rgba(255,255,255,.03); }
  .alerts li.high { border-color: var(--crit); } .alerts li.medium { border-color: var(--warn); } .alerts li.none { border-color: var(--ok); }
  .alerts b { font-size: 14px; } .alerts span { font-size: 13px; color: var(--muted); }
  h4.mini { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 16px 0 8px; }
  .cons { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; color: #d5e2f4; }
  .disclaimer { margin: 10px 0 0; }
  .drivers { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .drivers li { display: grid; grid-template-columns: 1fr 90px 160px 52px; gap: 10px; align-items: center; font-size: 14px; }
  .drivers .dv { color: var(--muted); text-align: right; font-size: 13px; }
  .drivers .bar { position: relative; height: 8px; background: rgba(255,255,255,.05); border-radius: 4px; }
  .drivers .bar::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line); }
  .drivers .bar i { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
  .drivers .dc { text-align: right; font-size: 13px; } .dc.up { color: #ff9d94; } .dc.down { color: #9fe9c8; }
  .hla { width: 100%; border-collapse: collapse; font-size: 13px; }
  .hla th, .hla td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; }
  .hla thead th { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .hla tbody th { font-family: var(--mono); font-weight: 500; color: var(--muted); }
  .al { font-family: var(--mono); font-size: 12px; padding: 2px 6px; border-radius: 5px; margin-right: 4px; background: rgba(255,255,255,.05); white-space: nowrap; }
  .al.mm { background: rgba(255,138,31,.18); color: #ffc58f; box-shadow: inset 0 0 0 1px rgba(255,138,31,.4); }
  .imm { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
  .imm div, .mtiles div { display: grid; padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,.03); border: 1px solid var(--line); }
  .imm span, .mtiles span { font-size: 12px; color: var(--muted); } .imm b { font-size: 18px; font-weight: 500; }
  .el-h { display: flex; justify-content: space-between; font-size: 13.5px; } .el-h b { font-size: 18px; font-weight: 500; } .hotc { color: var(--ember); }
  .el-bar { position: relative; height: 8px; border-radius: 4px; background: rgba(255,255,255,.06); margin-top: 8px; }
  .el-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: linear-gradient(90deg, var(--blue), var(--ember)); }
  .el-bar em { position: absolute; top: -4px; bottom: -4px; width: 2px; background: #fff; }
  .trends { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .trends figure { margin: 0; padding: 12px; border-radius: 12px; background: rgba(3,12,26,.45); border: 1px solid var(--line); }
  .trends figcaption { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; } .trends figcaption span { font-size: 13px; color: #d5e2f4; }
  .trends .u { font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
  .cx-chart { width: 100%; height: auto; display: block; overflow: visible; }
  .cx-grid { stroke: rgba(140,175,220,.12); stroke-width: 1; }
  .cx-ylab, .cx-xlab { fill: var(--muted); font-size: 10px; font-family: var(--mono); }
  .cx-th { stroke-dasharray: 5 4; stroke-width: 1.2; opacity: .9; } .cx-thlab { font-size: 10px; font-family: var(--mono); }
  .cx-band { fill: rgba(180,139,255,.12); } .cx-ev { stroke-width: 1; stroke-dasharray: 2 3; opacity: .7; }
  .cx-end { fill: var(--text); font-size: 11px; font-family: var(--mono); }
  .bx { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  .bx li { display: grid; grid-template-columns: 52px 1fr; gap: 12px; padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,.03); border-left: 3px solid var(--muted); }
  .bx li.rej { border-color: var(--crit); } .bx b { font-size: 14px; display: block; } .bx span:not(.mono) { font-size: 12.5px; color: var(--muted); } .bx .mono { color: var(--muted); font-size: 13px; }
  .rvf { display: grid; gap: 6px; } .rvf label { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .rvf select, .rvf textarea, .rvf input, .vf input, .th input { background: var(--ink); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; outline: none; width: 100%; }
  .rvf select:focus, .rvf textarea:focus, .rvf input:focus, .vf input:focus, .th input:focus { border-color: var(--blue); }
  .rv-actions { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .rvlist { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
  .rvlist li { display: grid; gap: 2px; font-size: 14px; } .rvlist p { margin: 4px 0 0; color: #d5e2f4; font-size: 13.5px; }

  dialog { border: 1px solid var(--line); border-radius: 16px; background: #071a36; color: var(--text); padding: 22px; width: min(640px, calc(100% - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  .vf h3 { font-size: 17px; margin-bottom: 12px; }
  .vgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; } .vgrid label { font-size: 12.5px; color: var(--muted); display: grid; gap: 5px; }
  .vgrid .ck { display: flex; align-items: center; gap: 8px; grid-column: 1 / -1; } .vgrid .ck input { width: auto; }

  .prose p { color: #d5e2f4; max-width: 70ch; margin: 0 0 12px; }
  .kv { display: grid; grid-template-columns: 120px 1fr; gap: 8px 14px; font-size: 14px; margin: 0; } .kv dt { color: var(--muted); } .kv dd { margin: 0; }
  .mtiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 10px; } .mtiles b { font-size: 22px; font-weight: 500; }
  .lims { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: #d5e2f4; }
  .th-list { display: grid; } .th-row { display: grid; grid-template-columns: 1fr 260px; gap: 20px; padding: 14px 0; border-bottom: 1px solid var(--line); align-items: center; }
  .th-row label { display: grid; gap: 3px; } .th-in { display: grid; gap: 4px; }

  @media (max-width: 1180px) {
    .tiles { grid-template-columns: repeat(3, 1fr); } .g-2-1, .g-1-1 { grid-template-columns: 1fr; }
    .trends { grid-template-columns: 1fr 1fr; } .labs-strip { grid-template-columns: repeat(5, 1fr); } .labs-strip .eyebrow { grid-column: 1 / -1; }
  }
  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; }
    .rail { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 12px; }
    .rail .grp, .rail .me .sub { display: none; } .rail .brand { padding: 4px 8px; } .rail .me { margin: 0 0 0 auto; border: 0; padding: 0; }
    #main { padding: 0 16px 40px; } #gsearch { display: none; }
    .tiles { grid-template-columns: 1fr 1fr; } .pt-head { grid-template-columns: 1fr; } .pt-risk { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 14px; }
    .facts { grid-template-columns: 1fr 1fr; } .trends { grid-template-columns: 1fr; } .drivers li { grid-template-columns: 1fr 70px 90px 44px; }
    .th-row { grid-template-columns: 1fr; } .mtiles { grid-template-columns: 1fr 1fr; } .vgrid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<nav class="rail" aria-label="Workspace">
  <a class="brand" href="index.html"><img src="assets/logos/cortexai-mark.png" alt="CortexAI"><span>Clinic</span></a>
  <div class="grp">Care</div>
  <a href="#worklist" data-v="worklist"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M2 8h12M2 12h8"/></svg>Worklist</a>
  <div class="grp">Model</div>
  <a href="#model" data-v="model"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="2" width="11" height="12" rx="2"/><path d="M5 6h6M5 9h6M5 12h3"/></svg>Model card</a>
  <a href="#thresholds" data-v="thresholds"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4h10M3 8h10M3 12h10"/><circle cx="6" cy="4" r="1.5" fill="currentColor"/><circle cx="10" cy="8" r="1.5" fill="currentColor"/><circle cx="5" cy="12" r="1.5" fill="currentColor"/></svg>Alert thresholds</a>
  <div class="grp admin-only">Administration</div>
  <a href="#team" data-v="team" class="admin-only"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="6" r="2.5"/><path d="M1.5 13.5c.8-2.4 2.5-3.5 4.5-3.5s3.7 1.1 4.5 3.5M11 4.5a2 2 0 010 4M12.5 10.5c1 .5 1.7 1.5 2 3"/></svg>Team and access</a>
  <a href="#audit" data-v="audit" class="admin-only"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/></svg>Audit log</a>
  <div class="me"><b id="uname">—</b><span class="sub" id="urole"></span><button class="btn" id="logout">Sign out</button></div>
</nav>
<div id="main">
  <div class="top">
    <div class="tt"><h1 id="title">Worklist</h1><div id="crumb"></div></div>
    <label for="gsearch" class="sr">Find recipient</label><input id="gsearch" placeholder="Find recipient by ID…" autocomplete="off">
    <span id="mode">…</span>
  </div>
  <div id="view"><div class="loading">Loading…</div></div>
</div>
<dialog id="dlg" aria-label="Add lab results"></dialog>
<script src="assets/js/api.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
